name: Android floating-pets APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-overlay.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-overlay:
    name: Compile Android floating pet prototype
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android 35 platform and tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble the Android debug APK
        run: gradle -p android --no-daemon --stacktrace assembleDebug
      - name: Verify APK exists and no desktop save is packaged
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          if unzip -Z1 android/app/build/outputs/apk/debug/app-debug.apk | grep -E '(^|/)state\.json$'; then
            echo "ERROR: desktop save included in APK"
            exit 1
          fi
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiniMenaces-Android-Prototype-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      # GitHub Actions artifacts require a signed-in GitHub account on mobile.
      # Publish an APK to a public prerelease for direct, sign-in-free downloads.
      - name: Publish mobile-friendly Android preview APK
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="android-overlay-v0.1.0-preview"
          src="android/app/build/outputs/apk/debug/app-debug.apk"
          cp "$src" "MiniMenaces-Android-Preview.apk"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" MiniMenaces-Android-Preview.apk --clobber
          else
            gh release create "$tag" MiniMenaces-Android-Preview.apk \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Mini Menaces Android Overlay Preview v0.1" \
              --notes "Early Android overlay prototype for testing two floating pixel pets. Download MiniMenaces-Android-Preview.apk directly from this release on your phone. No GitHub login required. Grant Display over other apps manually in Android settings, then open Mini Menaces and tap Let pets roam. This is debug-signed, is not the full cottage game, and may require uninstall before updating future previews because debug signing keys can change."
          fi
