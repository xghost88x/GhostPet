name: Python checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m compileall -q ghostpet.py activities.py house.py nursery.py tests
      - name: Test house floor plans and pathfinding
        run: python -m unittest discover -s tests -v
