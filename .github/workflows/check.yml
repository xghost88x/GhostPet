name: Python checks
on:
  push:
  pull_request:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m compileall -q ghostpet.py activities.py house.py nursery.py pet_presence.py adopted_sprites.py cottage_art.py updater.py updater_core.py tests
      - name: Check launcher scripts
        run: bash -n start.sh install.sh update.sh
      - name: Install Qt bindings for offscreen UI smoke test
        run: python -m pip install -r requirements.txt
      - name: Test navigation, safe updates and real Qt UI
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v
